<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>联调客户端</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      input, button { font: inherit; padding: 6px 10px; }
      input { width: 110px; }
      pre { background: #f4f4f4; padding: 12px; overflow: auto; min-height: 120px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
      #error { color: #b00020; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>联调客户端</h1>
    <p>只用来验证协议，书里不讲解。开两个浏览器窗口（其中一个用无痕模式，这样是两个不同的游客账号），用同一个房间号连接。</p>
    <div class="row">
      <input id="room" value="demo" aria-label="房间号" />
      <span id="player">未登录</span>
      <button id="connect">连接</button>
    </div>
    <div class="row">
      <button id="ready" disabled>准备</button>
      <button id="roll" disabled>掷骰子</button>
    </div>
    <div id="error"></div>
    <pre id="state">未连接</pre>
    <script>
      const $ = (id) => document.getElementById(id);
      let ws = null;

      // 游客登录：第一次由服务端生成凭证，保存在本地；以后带着凭证回到同一个账号。
      async function login() {
        const secret = localStorage.getItem("guestSecret");
        const response = await fetch("/auth/guest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(secret ? { secret } : {}),
        });
        if (!response.ok) throw new Error("登录失败：" + response.status);
        const session = await response.json();
        if (session.guestSecret) localStorage.setItem("guestSecret", session.guestSecret);
        $("player").textContent = session.playerId;
        return session;
      }

      function send(type) {
        ws.send(JSON.stringify({ type }));
      }

      $("connect").onclick = async () => {
        if (ws) ws.close();
        const session = await login().catch((error) => {
          $("error").textContent = error.message;
          return null;
        });
        if (!session) return;
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const room = encodeURIComponent($("room").value);
        // 浏览器的 WebSocket 不能设置请求头，访问令牌放在子协议里。
        ws = new WebSocket(`${scheme}://${location.host}/room/${room}/ws`, ["game.v1", "auth." + session.accessToken]);
        ws.onopen = () => {
          $("ready").disabled = $("roll").disabled = false;
          $("error").textContent = "";
        };
        ws.onclose = () => {
          $("ready").disabled = $("roll").disabled = true;
          $("state").textContent = "连接已断开";
        };
        ws.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "state") {
            $("error").textContent = "";
            $("state").textContent = JSON.stringify(message.state, null, 2);
          } else {
            $("error").textContent = "错误：" + message.code;
          }
        };
      };
      $("ready").onclick = () => send("ready");
      $("roll").onclick = () => send("roll");
    </script>
  </body>
</html>
